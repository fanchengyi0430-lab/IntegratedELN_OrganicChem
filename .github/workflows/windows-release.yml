name: Windows notebook download

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and verify the portable download
        run: python -B nbapp/packaging/build_windows_zip.py
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Organic-Chemistry-Notebook-Windows-x64.zip
          archive: false
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Organic-Chemistry-Notebook-Windows-x64.zip
          skip-decompress: true
      - name: Publish the Windows ZIP for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Organic-Chemistry-Notebook-Windows-x64.zip --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
