# Settings for the notebook app. Restart the app after editing.
user: ""                # name written to the change log with each save
port: 8765              # the app uses the next free port if this one is taken
inventory_dir: inventory # folder of inventory .xlsx exports, relative to the project folder
own_group: ""           # this group's bottles are listed first in inventory searches
reference_lookup: "off" # set to pubchem to enable user-requested compound look-up
